# Sentinel: every weekday morning, check Rome's lost-and-found page for a new list, import it,
# anchor its fingerprint on Avalanche and notify citizens whose alerts match a new item.
name: Import official found-items list
on:
  schedule:
    - cron: "17 6 * * 1-5"   # 07:17 / 08:17 Rome time
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the Ritrovo operator token is needed: the import goes through Ritrovo's own API.
      OPERATOR_TOKEN: ${{ secrets.RITROVO_OPERATOR_TOKEN }}
      API_BASE: https://izrggntqsssfzazjfhht.supabase.co/functions/v1/api
    steps:
      - name: Skip when the secret isn't set
        if: env.OPERATOR_TOKEN == ''
        run: echo "::notice::RITROVO_OPERATOR_TOKEN is not set in the repository secrets, so the import is skipped."
      - uses: actions/checkout@v4
        if: env.OPERATOR_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.OPERATOR_TOKEN != ''
        with:
          python-version: "3.13"
      - if: env.OPERATOR_TOKEN != ''
        run: pip install -r requirements.txt
      - name: Import
        if: env.OPERATOR_TOKEN != ''
        run: python3 pipeline/import_new_list.py
